---
apiVersion: rds.aws.upbound.io/v1beta1
kind: DBInstance
metadata:
  name: {{ .Values.serviceName }}-db
spec:
  forProvider:
    region: {{ .Values.region }}
    allocatedStorage: 20
    engine: postgres
    engineVersion: "14.1"
    instanceClass: {{ .Values.rds.instanceClass }}
    username: {{ .Values.rds.username }}
    passwordSecretRef:
      namespace: crossplane-system
      name: {{ .Values.rds.passwordSecretName }}
      key: password
    skipFinalSnapshotBeforeDeletion: true
    tags:
      {{- range $key, $val := .Values.tags }}
      {{ $key }}: {{ $val | quote }}
      {{- end }}
  writeConnectionSecretToRef:
    name: {{ .Values.serviceName }}-rds-conn
    namespace: crossplane-system
  providerConfigRef:
    name: aws-provider
