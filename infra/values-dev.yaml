serviceName: &serviceName myapp
region: &region us-west-1

tags: &tags
  environment: development
  team: devops


service-bucket:
  serviceName: *serviceName
  region: *region
  tags: *tags

multi-verse-1:

  replicaCount: 1

  image:
    repository: *serviceName
    pullPolicy: IfNotPresent
    tag: ""

  imagePullSecrets: [ ]
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: { }
    name: ""

  podAnnotations: { }
  podLabels: { }

  podSecurityContext: { }

  securityContext: { }

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: { }
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: [ ]

  resources: { }

  livenessProbe:
    exec:
      command:
        - cat
        - /dev/null
  readinessProbe:
    exec:
      command:
        - cat
        - /dev/null

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  volumes: [ ]

  volumeMounts: [ ]

  nodeSelector: { }

  tolerations: [ ]

  affinity: { }
